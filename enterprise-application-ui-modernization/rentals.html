<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Equipment Rentals</title>

    <link
        href="./css/full.css"
        rel="stylesheet">

    <link
        href="./css/rental.css"
        rel="stylesheet">

    <script
        src="./js/rentals.js"
        type="text/javascript">
    </script>
</head>

<body onload="Rental('Stroller')">

    <div class="box">

        <div class="nav-menu">

            <a
                class="square-btn"
                href="rentals.html">
                RENTALS
            </a>

            <a
                class="square-btn"
                href="express.html">
                PREMIUM ACCESS
            </a>

            <a
                class="square-btn"
                href="tickets.html">
                PARK TICKETS
            </a>

            <a
                class="square-btn"
                href="annualPasses.html">
                MEMBERSHIPS
            </a>

            <a
                class="square-btn"
                href="main.html">
                CHANGE VENUE
            </a>

            <a 
                class="square-btn" 
                href="map.html">
                MAP
            </a>

        </div>

        <br><br><br>


        <!-- =========================================================
             RENTAL FILTERS
             ========================================================= -->

        <ul class="social">

            <li>
                <a
                    class="buttons"
                    id="Stroller"
                    style="--bg: #3a83f7"
                    onclick="Rental('Stroller')">
                    Strollers
                </a>
            </li>

            <li>
                <a
                    class="buttons"
                    id="ADA"
                    style="--bg: #3a83f7"
                    onclick="Rental('ADA')">
                    WC / ECV
                </a>
            </li>

        </ul>


        <!-- =========================================================
             RENTAL CONTENT
             ========================================================= -->

        <div class="subbox">

            <br>

            <div class="image-left">

                <img
                    src="./images/SampleParkLogo.png"
                    alt="Sample Park Logo"
                    width="190">

            </div>


            <div>

                <span
                    class="bigtext"
                    id="LogoText">
                    Rentals
                </span>

                <br>

                <span id="RentalType"></span>

                <br><br>


                <!-- =================================================
                     PRICING TABLE
                     ================================================= -->

                <table
                    class="dTable"
                    id="dataTable">

                    <thead>

                        <tr>

                            <th class="ProductDescription">
                                RENTAL OPTIONS
                            </th>

                            <th>
                                STANDARD
                            </th>

                        </tr>

                    </thead>


                    <tbody>
                    </tbody>

                </table>

            </div>


            <p id="bottomText"></p>

        </div>

    </div>

</body>

</html>
